[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "thesis-code"
version = "0.1.0"
description = "Code accompanying my thesis"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "tensorflow==2.20.0",
    "keras==3.13.2",
    "pandas==2.2.2",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "h5py==3.15.1",
    "gurobipy==13.0.2",
    "iisignature @ git+https://github.com/bottler/iisignature.git@b56bc3819c9d48d3c536c8f1571807dbfddfc72a",
]


[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
src = ["src"]


[tool.uv]
link-mode = "copy"